<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2e38"/>
      <stop offset="1" stop-color="#14141a"/>
    </linearGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf1"/>
      <stop offset="1" stop-color="#efe6cf"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- 棋子投影 -->
  <circle cx="128" cy="138" r="80" fill="#000000" opacity="0.35"/>

  <!-- 棋子主体 -->
  <circle cx="128" cy="128" r="80" fill="url(#piece)"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="#d9cdb0" stroke-width="2"/>
  <circle cx="128" cy="128" r="66" fill="none" stroke="#c0392b" stroke-width="5"/>

  <!-- 帅 字 -->
  <text x="128" y="128" dy=".36em" text-anchor="middle"
        font-family="KaiTi, STKaiti, BiauKai, serif"
        font-size="82" font-weight="bold" fill="#c0392b">帅</text>
</svg>
